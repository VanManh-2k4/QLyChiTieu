services:
  # Backend Service
  - type: web
    name: qlychitieu-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: 2FA_ISSUER
        value: QLyChiTieu
    disk:
      name: data
      mountPath: /opt/render/project/backend/src/database
      sizeGB: 1

  # Frontend Service
  - type: web
    name: qlychitieu-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://qlychitieu-backend.onrender.com
